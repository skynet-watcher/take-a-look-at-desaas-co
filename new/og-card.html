<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>OG Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    background: #f8f6f1;
    font-family: "Inter", system-ui, sans-serif;
    color: #101820;
    position: relative;
    display: flex;
    align-items: center;
  }

  /* Subtle grid texture */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(16,24,32,0.045) 1px, transparent 1px),
      linear-gradient(rgba(16,24,32,0.045) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: linear-gradient(135deg, black 0%, rgba(0,0,0,0.5) 50%, transparent 85%);
    pointer-events: none;
  }

  /* Left accent bar */
  .accent-bar {
    position: absolute;
    top: 0; left: 0;
    width: 5px; height: 100%;
    background: linear-gradient(180deg, #2f7d68 0%, #1a4f3f 100%);
  }

  /* ── LEFT PANEL ── */
  .left {
    position: relative;
    z-index: 1;
    padding: 0 64px 0 76px;
    width: 560px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* Wordmark row */
  .wordmark {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 52px;
  }

  .de-mark {
    width: 54px;
    height: 54px;
    background: #101820;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(16,24,32,0.25);
  }

  .de-mark-text {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 26px;
    line-height: 1;
    color: #2f7d68;
    margin-top: 2px;
  }

  .brand-name {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #101820;
  }

  .brand-name span {
    color: #2f7d68;
  }

  /* Hero headline */
  .headline {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 72px;
    line-height: 1.02;
    letter-spacing: -2px;
    color: #101820;
    margin-bottom: 26px;
  }

  .headline em {
    font-style: italic;
    color: #2f7d68;
  }

  /* Sub */
  .sub {
    font-size: 19px;
    font-weight: 500;
    color: #58616d;
    line-height: 1.55;
    max-width: 420px;
    margin-bottom: 40px;
  }

  /* CTA pill */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: #101820;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 11px 22px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    width: fit-content;
  }

  .cta-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #2f7d68;
    flex-shrink: 0;
  }

  /* Domain */
  .domain {
    position: absolute;
    bottom: 40px;
    left: 76px;
    font-size: 14px;
    font-weight: 500;
    color: rgba(88,97,109,0.6);
    letter-spacing: 0.5px;
    z-index: 2;
  }

  /* ── RIGHT PANEL ── */
  .right {
    position: relative;
    z-index: 1;
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Big centered De mark */
  .hero-de {
    position: relative;
    width: 520px;
    height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Outer glow ring */
  .ring-outer {
    position: absolute;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    border: 1px solid rgba(47,125,104,0.12);
    background: radial-gradient(circle at 50% 50%, rgba(47,125,104,0.06) 0%, transparent 70%);
  }

  .ring-mid {
    position: absolute;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    border: 1.5px dashed rgba(47,125,104,0.18);
  }

  /* Center tile */
  .de-tile {
    position: relative;
    width: 130px;
    height: 130px;
    background: #101820;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 0 1px rgba(47,125,104,0.15),
      0 24px 80px rgba(16,24,32,0.28),
      0 8px 24px rgba(47,125,104,0.12);
    z-index: 2;
  }

  .de-tile-text {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 52px;
    color: #2f7d68;
    line-height: 1;
    margin-top: 4px;
  }

  /* Orbiting owned-tool chips */
  .chip {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(223,242,235,0.9);
    border: 1.5px solid rgba(47,125,104,0.22);
    border-radius: 999px;
    padding: 8px 16px 8px 10px;
    font-size: 12px;
    font-weight: 700;
    color: #1f5c4c;
    white-space: nowrap;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(47,125,104,0.1);
  }

  .chip-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #2f7d68;
    flex-shrink: 0;
  }

  /* faded cancelled chips */
  .chip-out {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.55);
    border: 1.5px solid rgba(16,24,32,0.08);
    border-radius: 999px;
    padding: 7px 14px 7px 10px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(88,97,109,0.5);
    white-space: nowrap;
    text-decoration: line-through;
    text-decoration-color: rgba(88,97,109,0.3);
  }

  .chip-out-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(88,97,109,0.25);
    flex-shrink: 0;
  }

  /* connector lines drawn in SVG */
  .connectors {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="accent-bar"></div>

<!-- LEFT -->
<div class="left">
  <div class="wordmark">
    <div class="de-mark">
      <span class="de-mark-text">De</span>
    </div>
    <div class="brand-name">De<span>SaaS</span></div>
  </div>

  <h1 class="headline">Own your<br><em>tools.</em></h1>

  <p class="sub">Audit your stack. Cancel the bloat. Replace it with software your team actually owns.</p>

  <div class="cta"><span class="cta-dot"></span>Book a free audit → desaas.co</div>
</div>

<!-- RIGHT -->
<div class="right">
  <svg class="connectors" viewBox="0 0 640 630" xmlns="http://www.w3.org/2000/svg">
    <!-- lines from center (320,315) to chips -->
    <line x1="320" y1="315" x2="200" y2="152" stroke="#2f7d68" stroke-width="1" stroke-dasharray="4 5" opacity="0.25"/>
    <line x1="320" y1="315" x2="480" y2="155" stroke="#2f7d68" stroke-width="1" stroke-dasharray="4 5" opacity="0.25"/>
    <line x1="320" y1="315" x2="510" y2="330" stroke="#2f7d68" stroke-width="1" stroke-dasharray="4 5" opacity="0.25"/>
    <line x1="320" y1="315" x2="430" y2="490" stroke="#2f7d68" stroke-width="1" stroke-dasharray="4 5" opacity="0.25"/>
    <line x1="320" y1="315" x2="170" y2="480" stroke="#2f7d68" stroke-width="1" stroke-dasharray="4 5" opacity="0.25"/>
    <!-- faded lines -->
    <line x1="320" y1="315" x2="135" y2="285" stroke="#58616d" stroke-width="1" stroke-dasharray="3 5" opacity="0.12"/>
    <line x1="320" y1="315" x2="230" y2="500" stroke="#58616d" stroke-width="1" stroke-dasharray="3 5" opacity="0.12"/>
  </svg>

  <div class="hero-de">
    <div class="ring-outer"></div>
    <div class="ring-mid"></div>
    <div class="de-tile">
      <span class="de-tile-text">De</span>
    </div>

    <!-- Owned chips (green) — pentagon, radius ~200px from center (260,260) -->
    <!-- Top center: 260, 60 -->
    <div class="chip" style="top:44px; left:50%; transform:translateX(-50%);">
      <span class="chip-dot"></span>Workflow
    </div>
    <!-- Top-right: ~450, 155 -->
    <div class="chip" style="top:138px; right:28px;">
      <span class="chip-dot"></span>Finance
    </div>
    <!-- Bottom-right: ~395, 408 -->
    <div class="chip" style="bottom:88px; right:44px;">
      <span class="chip-dot"></span>Support
    </div>
    <!-- Bottom-left: ~125, 408 -->
    <div class="chip" style="bottom:82px; left:20px;">
      <span class="chip-dot"></span>Customer Success
    </div>
    <!-- Top-left: ~70, 155 -->
    <div class="chip" style="top:134px; left:28px;">
      <span class="chip-dot"></span>Sales
    </div>

    <!-- Cancelled chips (faded) -->
    <div class="chip-out" style="top:265px; right:14px;">
      <span class="chip-out-dot"></span>Salesforce
    </div>
    <div class="chip-out" style="bottom:195px; left:30px;">
      <span class="chip-out-dot"></span>HubSpot
    </div>
  </div>
</div>

<div class="domain">desaas.co</div>

</body>
</html>
